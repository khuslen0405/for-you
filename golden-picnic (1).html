<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Алтан үдшийн пикник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/*
VOICE: tender, warm, quiet — a love letter at golden hour
IDEA: a pastoral anime-style evening meadow by an alpine lake, a picnic you walk through
PICTURE: full-screen 3D scene — meadow, oak, polaroids on fairy lights, letter, radio, lanterns at night
COLOUR and TYPE: honey gold, meadow green, cream; Caveat handwriting + Lora
LAYOUT: scene fills screen; title top, pill nav bottom, cards as letters
*/
:root{color-scheme:dark;--gold:#ffcf86;--cream:#fbf1de;--ink:#3b2a1c;--glass:rgba(40,26,14,.42)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1410;font-family:Lora,Georgia,serif;color:var(--cream)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;padding:max(18px,env(safe-area-inset-top)) 60px 0;text-align:center;pointer-events:none;transition:opacity .8s}
.top h1{margin:0;font:700 clamp(30px,7vw,56px)/1.02 Caveat,cursive;color:#fff6e6;text-shadow:0 2px 18px rgba(120,60,10,.55),0 0 2px rgba(0,0,0,.3);text-wrap:balance}
.top p{margin:6px 0 0;font:500 clamp(19px,3.6vw,26px)/1.2 Caveat,cursive;color:#ffe2b0;text-shadow:0 1px 10px rgba(90,40,0,.6)}
.gear{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,230,190,.45);background:var(--glass);color:#ffe9c4;font-size:20px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 10px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.hint{pointer-events:none;font:600 20px/1.2 Caveat,cursive;color:#fff3dc;text-shadow:0 1px 8px rgba(60,25,0,.8);min-height:24px;text-align:center;transition:opacity .5s}
.pills{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:640px}
.pills button{height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(255,225,180,.5);background:var(--glass);color:#fff1da;font:600 15px Lora,serif;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .25s,transform .2s}
.pills button:hover{background:rgba(120,70,25,.55)}
.pills button.on{background:linear-gradient(#ffd99a,#f2b25e);color:#4a2a0c;border-color:#ffe6bb}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #ffd27a;outline-offset:2px}
.veil{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 35%,rgba(255,190,110,.25),rgba(25,15,8,.82));z-index:20;transition:opacity 1.2s}
.veil.hide{opacity:0;pointer-events:none}
.start{text-align:center;max-width:420px}
.start h2{margin:0;font:700 clamp(44px,10vw,68px)/1 Caveat,cursive;color:#fff3dc;text-shadow:0 0 30px rgba(255,170,70,.6)}
.start p{font:italic 17px/1.5 Lora,serif;color:#ffe3bd;margin:14px 0 26px}
.start button{height:52px;padding:0 34px;border-radius:26px;border:0;background:linear-gradient(#ffe2a8,#f0a650);color:#4a260a;font:700 18px Lora,serif;cursor:pointer;box-shadow:0 8px 30px rgba(255,160,60,.45)}
.start small{display:block;margin-top:16px;color:#d9b88c;font-size:13px}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:rgba(20,12,6,.55);opacity:0;pointer-events:none;transition:opacity .45s}
.modal.open{opacity:1;pointer-events:auto}
.paper{position:relative;width:min(520px,100%);max-height:86vh;overflow:auto;background:linear-gradient(#fff8ea,#f6e6c8);color:var(--ink);border-radius:6px;padding:34px 30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 60px rgba(190,140,70,.18);transform:translateY(18px) rotate(-.6deg);transition:transform .5s}
.modal.open .paper{transform:none}
.paper h3{margin:0 0 14px;font:700 34px/1.05 Caveat,cursive;color:#7a3b1c}
.paper .body{font:23px/1.4 Caveat,cursive;white-space:pre-wrap}
.paper .sign{margin-top:18px;text-align:right;font:700 26px Caveat,cursive;color:#7a3b1c}
.x{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;background:none;font-size:26px;color:#8a5a33;cursor:pointer}
.photo{width:min(440px,100%);background:#fff;padding:14px 14px 10px;border-radius:3px;box-shadow:0 30px 80px rgba(0,0,0,.55);transform:rotate(-1.5deg);position:relative}
.photo img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#ddd}
.photo div{font:700 28px/1.3 Caveat,cursive;color:#3b2a1c;text-align:center;padding-top:8px}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font:600 14px Lora,serif;color:#6b4426}
.form input,.form textarea{font:16px Lora,serif;padding:10px 12px;border:1px solid #d6b98e;border-radius:6px;background:#fffdf7;color:#3b2a1c;width:100%}
.form textarea{min-height:120px;resize:vertical}
.form .row{display:flex;gap:10px;flex-wrap:wrap}
.form .row button{flex:1;height:46px;border-radius:23px;border:0;font:700 15px Lora,serif;cursor:pointer}
.save{background:linear-gradient(#ffd99a,#ee9f4a);color:#4a260a}.reset{background:#eadbc3;color:#6b4426}
.note{font-size:13px;color:#8a6a48;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="top" id="top"><h1 id="tTitle">Алтан үдшийн пикник</h1><p id="tSub">Хайрт минь, энэ үдэш чинийх</p></div>
<button class="gear" id="gear" aria-label="Тохируулах">⚙</button>

<div class="nav">
  <div class="hint" id="hint"></div>
  <div class="pills" id="pills">
    <button data-v="intro" class="on">Пикник</button>
    <button data-v="letter">Захидал</button>
    <button data-v="photos">Дурсамж</button>
    <button data-v="music">Хөгжим</button>
    <button data-v="finale">Дэнлүү</button>
    <button data-v="free">Чөлөөт</button>
  </div>
</div>

<div class="veil" id="veil"><div class="start">
  <h2>Алтан үдэш</h2>
  <p id="sTxt">Нар уулсын цаана шингэж байна. Чамд зориулж бяцхан пикник бэлдсэн юм.</p>
  <button id="go">Эхлэх</button>
  <small>Дуутай — чихэвч зүүвэл илүү гоё</small>
</div></div>

<div class="modal" id="mLetter"><div class="paper">
  <button class="x" data-close aria-label="Хаах">×</button>
  <h3 id="lTo">Хайрт минь,</h3>
  <div class="body" id="lBody"></div>
  <div class="sign" id="lFrom"></div>
</div></div>

<div class="modal" id="mPhoto"><div class="photo">
  <button class="x" data-close aria-label="Хаах" style="color:#555">×</button>
  <img id="pImg" alt=""><div id="pCap"></div>
</div></div>

<div class="modal" id="mSet"><div class="paper">
  <button class="x" data-close aria-label="Хаах">×</button>
  <h3>Өөрийнхөөрөө болгох</h3>
  <form class="form" id="setForm">
    <label>Хэнд зориулах вэ<input id="fName" maxlength="24"></label>
    <label>Гарчиг<input id="fTitle" maxlength="40"></label>
    <label>Захидал<textarea id="fBody"></textarea></label>
    <label>Хэнээс<input id="fFrom" maxlength="30"></label>
    <label>Зургууд (6 хүртэл)<input id="fPhotos" type="file" accept="image/*" multiple></label>
    <label>Өөрийн дуу (mp3, m4a…)<input id="fSong" type="file" accept="audio/*"></label>
    <p class="note" id="songNote"></p>
    <label>Зургийн тайлбар (мөр бүрд нэг)<textarea id="fCaps" style="min-height:90px"></textarea></label>
    <div class="row"><button type="button" class="reset" id="fReset">Анхны байдал</button><button type="submit" class="save">Хадгалах</button></div>
    <p class="note">Эдгээр нь зөвхөн энэ төхөөрөмж дээр хадгалагдана.</p>
  </form>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
{
/* ---------- content ---------- */
const DEF={
  name:'Хайрт минь',
  title:'Алтан үдшийн пикник',
  body:'Энэ үдшийг чамд зориулж бүтээлээ.\n\nНар уулсын цаана алтлан шингэж, салхи өвсийг зөөлөн илбэх энэ агшинд би зөвхөн чамайг л бодож байна.\n\nХамт өнгөрүүлсэн өдөр бүр минь яг ийм гэрэлтэй байсан. Цаашид ч олон олон пикник, олон олон нар жаргалтыг хамтдаа үзэх болтугай.\n\nБайгаад байгаад баярлалаа.',
  from:'Хүслэн',
  caps:['Анхны уулзалт','Нар жаргах үед','Бидний инээд','Аялал','Дуртай мөч','Хамтдаа'],
  photos:[]
};
let D=JSON.parse(JSON.stringify(DEF));
try{const s=localStorage.getItem('goldenPicnic');if(s)Object.assign(D,JSON.parse(s));}catch(e){}

const $=id=>document.getElementById(id);
const isMobile=Math.min(innerWidth,innerHeight)<700;

/* ---------- noise ---------- */
const hash=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5}return s/(1-Math.pow(.5,o))}
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const LAKE={x:40,z:-235,rx:250,rz:85};
function ridged(x,y){let s=0,a=1,f=1,w=0;for(let i=0;i<6;i++){const n=1-Math.abs(2*vnoise(x*f,y*f)-1);s+=a*n*n;w+=a;f*=2.07;a*=.5}return s/w}
function MT(x,z){const r=Math.hypot(x,z);const k=sstep(470,980,r+(vnoise(Math.atan2(z,x)*3,1)-.5)*260);if(k<=0)return 0;
  const front=sstep(-.2,-.9,z/r)*.45+.75;return k*front*(ridged(x*.0024+7,z*.0024)*620+fbm(x*.01,z*.01,3)*60)}
const lakeD=(x,z)=>((x-LAKE.x)/LAKE.rx)**2+((z-LAKE.z)/LAKE.rz)**2;
function H(x,z){
  const r=Math.hypot(x,z);
  let h=(fbm(x*.012+3,z*.012,4)-.45)*14*sstep(16,70,r)+fbm(x*.004+9,z*.004,3)*55*sstep(120,520,r)+Math.sin(x*.05)*.4*sstep(8,30,r);
  const ld=lakeD(x,z);const m=1-sstep(.75,1.15,ld);
  return h*(1-m)+m*-6+MT(x,z);
}

/* ---------- renderer ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.75:2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const FOG_DAY=new THREE.Color('#f0c48c'),FOG_NIGHT=new THREE.Color('#2a2545');
scene.fog=new THREE.Fog(FOG_DAY.clone(),90,2300);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.05,4000);
camera.position.set(30,30,70);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=1.52;controls.minDistance=.8;controls.maxDistance=70;controls.enablePan=false;
controls.target.set(0,1,0);

let SUN=new THREE.Vector3(.75,.11,-.65).normalize();

/* ---------- textures ---------- */
function glowTex(inner='rgba(255,240,200,1)',outer='rgba(255,170,60,0)'){
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,inner);gr.addColorStop(.25,'rgba(255,205,120,.75)');gr.addColorStop(1,outer);
  g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
const GLOW=glowTex();
const PINKGLOW=glowTex('rgba(255,235,240,1)','rgba(255,120,170,0)');

/* ---------- sky ---------- */
const GLSL_NOISE=`
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm2(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n2(p);p*=2.02;a*=.5;}return s;}`;
const skyU={uSun:{value:SUN},uNight:{value:0},uTime:{value:0}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(1600,48,24),new THREE.ShaderMaterial({
  uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:`varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 uSun;uniform float uNight,uTime;varying vec3 vD;${GLSL_NOISE}
  float h31(vec3 p){p=fract(p*.3183+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
  void main(){vec3 d=normalize(vD);float y=d.y;
   vec3 zen=mix(vec3(.38,.56,.82),vec3(.02,.03,.10),uNight);
   vec3 mid=mix(vec3(.99,.83,.60),vec3(.16,.12,.30),uNight);
   vec3 hor=mix(vec3(1.,.70,.40),vec3(.38,.20,.32),uNight);
   float t=max(y,0.);
   vec3 col=mix(hor,mid,smoothstep(0.,.10,t));col=mix(col,zen,smoothstep(.08,.6,t));
   float sd=max(dot(d,normalize(uSun)),0.);vec3 sc=vec3(1.,.72,.38);float day=1.-uNight;
   col+=sc*pow(sd,5.)*.5*day+sc*pow(sd,50.)*.5*day+vec3(1.,.93,.75)*smoothstep(.9985,.9993,sd)*1.6*day;
   col+=vec3(.9,.35,.3)*pow(sd,3.)*.35*uNight*(1.-smoothstep(0.,.25,y));
   vec2 uv=d.xz/max(y+.06,.04)*.55;uv.x+=uTime*.006;
   float cl=fbm2(uv*1.4+vec2(0.,3.));cl=smoothstep(.52,.82,cl)*smoothstep(0.,.07,y)*(1.-smoothstep(.3,.75,y));
   vec3 cc=mix(vec3(1.,.86,.68)+sc*pow(sd,3.)*.9,vec3(.22,.17,.33),uNight);
   col=mix(col,cc,cl*.85);
   vec3 sp=floor(d*320.);float hs=h31(sp);float st=step(.9972,hs)*smoothstep(.03,.25,y);
   col+=vec3(st)*uNight*(.55+.45*sin(uTime*2.5+hs*60.));
   float mn=smoothstep(.9994,.9997,dot(d,normalize(vec3(-.5,.45,-.75))));col+=vec3(1.,.96,.85)*mn*uNight;
   col+=vec3(.9,.9,1.)*pow(max(dot(d,normalize(vec3(-.5,.45,-.75))),0.),40.)*.25*uNight;
   if(y<0.)col=mix(col,hor*.85,smoothstep(0.,-.05,y));
   gl_FragColor=vec4(col,1.);}`
}));
sky.renderOrder=-1;scene.add(sky);

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0xffdcae,0x4d6a2c,.75);scene.add(hemi);
const sunL=new THREE.DirectionalLight(0xffc27a,1.25);
sunL.position.copy(SUN).multiplyScalar(60);sunL.castShadow=true;
sunL.shadow.mapSize.set(2048,2048);Object.assign(sunL.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:160});
sunL.shadow.bias=-.0006;scene.add(sunL);
const amb=new THREE.AmbientLight(0xffe6c8,.18);scene.add(amb);

/* ---------- ground ---------- */
{
  const g=new THREE.PlaneGeometry(3000,3000,isMobile?300:380,isMobile?300:380);g.rotateX(-Math.PI/2);
  const p=g.attributes.position,cols=[];const c=new THREE.Color();
  for(let i=0;i<p.count;i++)p.setY(i,H(p.getX(i),p.getZ(i)));
  g.computeVertexNormals();const nr=g.attributes.normal;
  const A=new THREE.Color('#5f8a32'),B=new THREE.Color('#b8a646'),C=new THREE.Color('#3f6427'),S=new THREE.Color('#c9b98c'),RK=new THREE.Color('#7d7a86'),RK2=new THREE.Color('#5d6070'),SN=new THREE.Color('#fbf3ec'),FO=new THREE.Color('#2f5128');
  for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),y=p.getY(i),ny=nr.getY(i),n=vnoise(x*.03,z*.03);
    c.copy(A).lerp(B,sstep(.45,.75,fbm(x*.02,z*.02,3))*.7).lerp(C,sstep(.2,-3,y)*.5);
    const ld=lakeD(x,z);if(ld<1.35)c.lerp(S,sstep(1.35,1.05,ld)*.6);
    if(y>70){c.lerp(FO,sstep(70,140,y)*.8);c.lerp(n>.5?RK:RK2,sstep(120,240,y)*Math.max(.55,sstep(.92,.7,ny)));
      c.lerp(SN,sstep(250+n*90,300+n*90,y)*sstep(.45,.75,ny))}
    cols.push(c.r,c.g,c.b)}
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));m.receiveShadow=true;scene.add(m);
}

/* ---------- lake ---------- */
const lakeU={uTime:{value:0},uNight:{value:0},uSun:{value:SUN},fogColor:{value:scene.fog.color},fogNear:{value:90},fogFar:{value:2300}};
{
  const lg=new THREE.CircleGeometry(1,96);lg.rotateX(-Math.PI/2);
  const lake=new THREE.Mesh(lg,new THREE.ShaderMaterial({uniforms:lakeU,
    vertexShader:`varying vec3 vW;varying float vF;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;vec4 mv=viewMatrix*w;vF=-mv.z;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform float uTime,uNight,fogNear,fogFar;uniform vec3 uSun,fogColor;varying vec3 vW;varying float vF;${GLSL_NOISE}
    void main(){vec3 v=normalize(cameraPosition-vW);float fr=pow(1.-max(v.y,0.),2.5);
     vec3 base=mix(vec3(.10,.30,.42),vec3(.03,.05,.12),uNight);vec3 rf=mix(vec3(.98,.74,.48),vec3(.24,.16,.32),uNight);
     vec3 col=mix(base,rf,.12+.5*fr*fr);
     float g=n2(vW.xz*.18+vec2(uTime*.35,0.))*n2(vW.xz*.41-vec2(0.,uTime*.25));
     vec3 r=reflect(-v,vec3(0,1,0));float s=pow(max(dot(r,normalize(uSun)),0.),30.);
     col+=vec3(1.,.85,.55)*s*(.4+4.*g*g)*(1.-uNight);
     col+=vec3(.9,.9,1.)*pow(max(dot(r,normalize(vec3(-.5,.45,-.75))),0.),60.)*(.3+2.*g)*uNight*.6;
     float f=smoothstep(fogNear,fogFar,vF);gl_FragColor=vec4(mix(col,fogColor,f),1.);}`}));
  lake.scale.set(LAKE.rx,1,LAKE.rz);lake.position.set(LAKE.x,-1.8,LAKE.z);scene.add(lake);
}

/* ---------- organic foliage ---------- */
function blobGeo(r,seed,ws=28,hs=18){const g=new THREE.SphereGeometry(r,ws,hs),p=g.attributes.position,v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const n=v.clone().normalize();
    const d=(vnoise(n.x*2.2+seed,n.y*2.2+n.z*1.7)-.5)*.42+(vnoise(n.x*6+seed*3,n.z*6+n.y*4)-.5)*.16;
    v.addScaledVector(n,d*r);v.y*=.86;p.setXYZ(i,v.x,v.y,v.z)}
  g.computeVertexNormals();return g}
function shadeCols(g,c1,c2){const p=g.attributes.position,cols=[],c=new THREE.Color(),A=new THREE.Color(c1),B=new THREE.Color(c2);
  g.computeBoundingBox();const y0=g.boundingBox.min.y,y1=g.boundingBox.max.y;
  for(let i=0;i<p.count;i++){const t=(p.getY(i)-y0)/(y1-y0),n=vnoise(p.getX(i)*3,p.getZ(i)*3+p.getY(i)*2);c.copy(A).lerp(B,Math.min(1,t*.9+n*.35));c.multiplyScalar(.62+.38*t);cols.push(c.r,c.g,c.b)}
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));return g}

const grassU={uTime:{value:0},uNight:{value:0},fogColor:{value:scene.fog.color},fogNear:{value:90},fogFar:{value:2300}};
{

  for(let i=0;i<segs;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}
  const g=new THREE.InstancedBufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);
  const N=isMobile?42000:95000,off=new Float32Array(N*3),par=new Float32Array(N*3);let k=0;
  while(k<N){const a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.65)*42,x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(Math.abs(x)<2.05&&Math.abs(z)<1.65)continue;
    off[k*3]=x;off[k*3+1]=H(x,z)-.05;off[k*3+2]=z;
    par[k*3]=(.35+Math.random()*.55)*(r<3?.6:1);par[k*3+1]=Math.random()*6.28;par[k*3+2]=Math.random();k++}
  g.setAttribute('aO',new THREE.InstancedBufferAttribute(off,3));g.setAttribute('aP',new THREE.InstancedBufferAttribute(par,3));
  g.instanceCount=N;
  const m=new THREE.Mesh(g,new THREE.ShaderMaterial({uniforms:grassU,side:THREE.DoubleSide,
    vertexShader:`attribute vec3 aO,aP;uniform float uTime;varying float vH,vV,vF,vPt;
    void main(){vec3 p=position;float h=p.y;p.y*=aP.x;float c=cos(aP.y),s=sin(aP.y);p=vec3(p.x*c,p.y,p.x*s);
     float w=sin(uTime*1.5+aO.x*.22+aO.z*.15)*.55+sin(uTime*2.9+aO.x*.8+aO.z*.3)*.18;
     p.x+=w*h*h*.32*aP.x;p.z+=w*h*h*.12*aP.x;
     vec4 mv=modelViewMatrix*vec4(p+aO,1.);vH=h;vV=aP.z;vF=-mv.z;vPt=sin(aO.x*.13+1.)*sin(aO.z*.11)+sin(aO.x*.31-aO.z*.27)*.4;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform float uNight,fogNear,fogFar;uniform vec3 fogColor;varying float vH,vV,vF,vPt;
    void main(){vec3 base=vec3(.12,.22,.06),tip=mix(vec3(.40,.55,.18),vec3(.68,.60,.30),clamp(vV*.7+vPt*.35,0.,1.));
     vec3 col=mix(base,tip,vH);col*=.55+.45*vH;col+=vec3(1.,.70,.30)*pow(vH,3.)*(.25+.25*vV);
     col*=mix(1.,.38,uNight);col+=vec3(.05,.06,.14)*uNight;
     gl_FragColor=vec4(mix(col,fogColor,smoothstep(fogNear,fogFar,vF)),1.);}`}));
  m.frustumCulled=false;scene.add(m);
}

let AC=null,master=null,musicOn=false,nextT=0,step=0;
function initAudio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=0;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
  const dl=AC.createDelay();dl.delayTime.value=.42;const fb=AC.createGain();fb.gain.value=.38;const wet=AC.createGain();wet.gain.value=.35;
  master.connect(lp);lp.connect(AC.destination);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(AC.destination);
}
const F=n=>440*Math.pow(2,(n-69)/12);
const CH=[[62,66,69,73],[57,61,64,69],[59,62,66,69],[55,59,62,66],[62,66,69,74],[57,61,64,67],[55,59,62,67],[57,61,64,69]];
const MEL=[78,76,74,76,73,0,76,78, 81,0,78,76,74,0,73,74, 78,76,74,73,71,0,74,76, 74,0,71,73,74,0,0,0];
function tone(f,t,d,v,type='triangle'){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function pad(ns,t,d){ns.forEach(n=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=F(n-12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.9);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.1)})}
const BEAT=60/72/2;
function schedule(){
  if(!AC||!musicOn)return;
  while(nextT<AC.currentTime+.25){
    const bar=Math.floor(step/8)%CH.length,s=step%8,ch=CH[bar];
    if(s===0){pad(ch,nextT,BEAT*8.2);tone(F(ch[0]-24),nextT,BEAT*7,.09,'sine')}
    const arp=[0,1,2,3,2,1,2,3][s];tone(F(ch[arp]+12),nextT,1.1,.045);
    const mn=MEL[step%MEL.length];if(mn&&step>=16)tone(F(mn),nextT,1.6,.06,'sine'),tone(F(mn+12),nextT,.6,.012);
    nextT+=BEAT;step++}
}
setInterval(schedule,60);

let song=null,songName='',fadeI=null;
function useSong(url,name){if(song){song.pause()}song=new Audio(url);song.loop=true;song.volume=0;songName=name||'';
  $('songNote').textContent=songName?'Одоогийн дуу: '+songName:'';if(musicOn){musicOn=false;setMusic(true)}}
function fade(to){clearInterval(fadeI);fadeI=setInterval(()=>{const v=song.volume+(to>song.volume?.05:-.05);
  if(Math.abs(to-song.volume)<=.05){song.volume=to;clearInterval(fadeI);if(to===0)song.pause()}else song.volume=Math.min(1,Math.max(0,v))},60)}
function idb(fn){try{const r=indexedDB.open('goldenPicnic',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{try{fn(r.result.transaction('kv','readwrite').objectStore('kv'))}catch(e){}};}catch(e){}}
idb(st=>{const q=st.get('song');q.onsuccess=()=>{const v=q.result;if(v&&v.blob)useSong(URL.createObjectURL(v.blob),v.name);else tryBundled()};q.onerror=tryBundled});
function tryBundled(){fetch('song.mp3',{method:'HEAD'}).then(r=>{if(r.ok&&!song)useSong('song.mp3','')}).catch(()=>{})}

function setMusic(on){
  if(song){musicOn=on;if(master&&AC)master.gain.value=0;
    if(on){song.play().then(()=>fade(.9)).catch(()=>{})}else fade(0);return}
  initAudio();if(!AC)return;AC.resume&&AC.resume();
  musicOn=on;const t=AC.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(on?.55:0,t+1.2);
  if(on&&nextT<t)nextT=t+.05;
}

    void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;
     c=c*c*(3.-2.*c)*.3+c*.66;
     float l=dot(c,vec3(.299,.587,.114));
     c=mix(vec3(l),c,1.0);
     vec3 sh=mix(vec3(.05,.08,.12),vec3(.06,.05,.16),uNight),hi=mix(vec3(1.06,.98,.86),vec3(.95,.97,1.08),uNight);
     c=c*mix(vec3(1.)+sh*(1.-l)*1.2,hi,smoothstep(.45,1.,l));

  radio.position.y=musicOn?Math.abs(Math.sin(T*Math.PI*1.2))*.012:0;
  {const p=dust.geometry.attributes.position,s=dust.userData.seed;for(let i=0;i<s.length;i++){p.setY(i,p.getY(i)+Math.sin(T*.6+s[i])*.0025);p.setX(i,p.getX(i)+Math.cos(T*.4+s[i]*2)*.002)}p.needsUpdate=true;
    dust.material.opacity=.55+.35*N;dust.material.color.set('#ffd88a').lerp(tmpC.set('#d6ff7a'),N);dust.material.size=.11+.06*N}
